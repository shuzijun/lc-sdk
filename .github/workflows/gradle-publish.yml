name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version'
        required: true
        type: string
  push:
    tags:
      - 'v*.*'

permissions:
  contents: write
  packages: write

jobs:
  quality-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Resolve release version
      id: version
      shell: bash
      env:
        DISPATCH_VERSION: ${{ inputs.version }}
      run: |
        if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
          version="${GITHUB_REF_NAME#v}"
        else
          version="${DISPATCH_VERSION#v}"
        fi
        if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
          echo "::error::Invalid release version: ${version}"
          exit 1
        fi
        echo "version=${version}" >> "${GITHUB_OUTPUT}"
        echo "tag=v${version}" >> "${GITHUB_OUTPUT}"

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '25'
        cache: gradle

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Run SDK quality gate
      run: ./gradlew clean test build --no-daemon --stacktrace
      env:
        LD_VERSION: ${{ steps.version.outputs.version }}

    - name: Upload quality gate reports
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: sdk-quality-gate-reports-${{ steps.version.outputs.version }}
        path: |
          build/reports/
          build/test-results/
        if-no-files-found: warn
        retention-days: 7

  release:
    needs: quality-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '25'
        cache: gradle

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Publish to Maven Central
      run: ./gradlew publishAndReleaseToMavenCentral --no-daemon --stacktrace
      env:
        LD_VERSION: ${{ needs.quality-gate.outputs.version }}
        ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
        ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
        ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
        ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}

    - name: Create draft GitHub release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ needs.quality-gate.outputs.tag }}
        name: ${{ needs.quality-gate.outputs.tag }}
        draft: true
        prerelease: ${{ contains(needs.quality-gate.outputs.version, '-') }}
        files: |
          build/libs/lc-sdk-${{ needs.quality-gate.outputs.version }}.jar
          build/libs/lc-sdk-${{ needs.quality-gate.outputs.version }}-sources.jar
          build/libs/lc-sdk-${{ needs.quality-gate.outputs.version }}-javadoc.jar
        fail_on_unmatched_files: true
